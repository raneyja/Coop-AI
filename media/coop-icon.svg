<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Hexagonal node-graph logo for CoopAI - black on transparent -->
  <!-- Outer nodes -->
  <circle cx="64" cy="18" r="6" fill="#000"/>
  <circle cx="100" cy="38" r="6" fill="#000"/>
  <circle cx="100" cy="90" r="6" fill="#000"/>
  <circle cx="64" cy="110" r="6" fill="#000"/>
  <circle cx="28" cy="90" r="6" fill="#000"/>
  <circle cx="28" cy="38" r="6" fill="#000"/>
  <!-- Inner ring -->
  <circle cx="64" cy="40" r="5" fill="#000"/>
  <circle cx="86" cy="52" r="5" fill="#000"/>
  <circle cx="86" cy="76" r="5" fill="#000"/>
  <circle cx="64" cy="88" r="5" fill="#000"/>
  <circle cx="42" cy="76" r="5" fill="#000"/>
  <circle cx="42" cy="52" r="5" fill="#000"/>
  <!-- Center -->
  <circle cx="64" cy="64" r="5" fill="#000"/>
  <!-- Connecting lines (simplified representative of the graph) -->
  <line x1="64" y1="18" x2="64" y2="40" stroke="#000" stroke-width="2"/>
  <line x1="64" y1="18" x2="100" y2="38" stroke="#000" stroke-width="2"/>
  <line x1="100" y1="38" x2="86" y2="52" stroke="#000" stroke-width="2"/>
  <line x1="100" y1="38" x2="100" y2="90" stroke="#000" stroke-width="2"/>
  <line x1="100" y1="90" x2="86" y2="76" stroke="#000" stroke-width="2"/>
  <line x1="100" y1="90" x2="64" y2="110" stroke="#000" stroke-width="2"/>
  <line x1="64" y1="110" x2="64" y2="88" stroke="#000" stroke-width="2"/>
  <line x1="64" y1="110" x2="28" y2="90" stroke="#000" stroke-width="2"/>
  <line x1="28" y1="90" x2="42" y2="76" stroke="#000" stroke-width="2"/>
  <line x1="28" y1="90" x2="28" y2="38" stroke="#000" stroke-width="2"/>
  <line x1="28" y1="38" x2="42" y2="52" stroke="#000" stroke-width="2"/>
  <line x1="28" y1="38" x2="64" y2="18" stroke="#000" stroke-width="2"/>
  <!-- Inner connections -->
  <line x1="64" y1="40" x2="86" y2="52" stroke="#000" stroke-width="1.5"/>
  <line x1="86" y1="52" x2="86" y2="76" stroke="#000" stroke-width="1.5"/>
  <line x1="86" y1="76" x2="64" y2="88" stroke="#000" stroke-width="1.5"/>
  <line x1="64" y1="88" x2="42" y2="76" stroke="#000" stroke-width="1.5"/>
  <line x1="42" y1="76" x2="42" y2="52" stroke="#000" stroke-width="1.5"/>
  <line x1="42" y1="52" x2="64" y2="40" stroke="#000" stroke-width="1.5"/>
  <line x1="64" y1="40" x2="64" y2="64" stroke="#000" stroke-width="1.5"/>
  <line x1="86" y1="52" x2="64" y2="64" stroke="#000" stroke-width="1.5"/>
  <line x1="86" y1="76" x2="64" y2="64" stroke="#000" stroke-width="1.5"/>
  <line x1="64" y1="88" x2="64" y2="64" stroke="#000" stroke-width="1.5"/>
  <line x1="42" y1="76" x2="64" y2="64" stroke="#000" stroke-width="1.5"/>
  <line x1="42" y1="52" x2="64" y2="64" stroke="#000" stroke-width="1.5"/>
</svg>
