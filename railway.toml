# Coop API — Railway Phase 1 (API + managed Postgres)
# Docs: docs/deploy-railway.md

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile.api"

[deploy]
startCommand = "/nodejs/bin/node dist/webhookServer.js"
preDeployCommand = "/nodejs/bin/node scripts/run-migrations.mjs"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
